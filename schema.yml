      properties:
        customer:
          type: string
          format: uuid
        daily_limit:
          type: string
          format: decimal
          pattern: ^-?\d{0,13}(?:\.\d{0,2})?$
        monthly_limit:
          type: string
          format: decimal
          pattern: ^-?\d{0,13}(?:\.\d{0,2})?$
        is_active:
          type: boolean
      required:
      - customer
      - daily_limit
      - monthly_limit
    Transaction:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        tenant:
          type: string
          format: uuid
          readOnly: true
        account:
          type: string
          format: uuid
        transaction_type:
          $ref: '#/components/schemas/TransactionTypeEnum'
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,13}(?:\.\d{0,2})?$
        status:
          allOf:
          - $ref: '#/components/schemas/TransactionStatusEnum'
          readOnly: true
        description:
          type: string
        idempotency_key:
          type: string
          nullable: true
          maxLength: 100
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - account
      - amount
      - created_at
      - id
      - status
      - tenant
      - transaction_type
      - updated_at
    TransactionRequest:
      type: object
      properties:
        account:
          type: string
          format: uuid
        transaction_type:
          $ref: '#/components/schemas/TransactionTypeEnum'
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,13}(?:\.\d{0,2})?$
        description:
          type: string
        idempotency_key:
          type: string
          nullable: true
          maxLength: 100
      required:
      - account
      - amount
      - transaction_type
    TransactionStatusEnum:
      enum:
      - PENDING
      - COMPLETED
      - FAILED
      - CANCELLED
      type: string
      description: |-
        * `PENDING` - Pending
        * `COMPLETED` - Completed
        * `FAILED` - Failed
        * `CANCELLED` - Cancelled
    TransactionTypeEnum:
      enum:
      - PIX
      - TED
      - BOOK
      - TECBAN
      type: string
      description: |-
        * `PIX` - PIX
        * `TED` - TED
        * `BOOK` - Book Transfer
        * `TECBAN` - TecBan
    Webhook:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        tenant:
          type: string
          format: uuid
          readOnly: true
        url:
          type: string
          format: uri
          maxLength: 200
        event_type:
          type: string
          maxLength: 50
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - event_type
      - id
      - tenant
      - updated_at
      - url
    WebhookRequest:
      type: object
      properties:
        url:
          type: string
          format: uri
          minLength: 1
          maxLength: 200
        event_type:
          type: string
          minLength: 1
          maxLength: 50
        is_active:
          type: boolean
      required:
      - event_type
      - url
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: Authorization
      description: 'API key authentication. Add your API key with header "Authorization:
        your-api-key"'
