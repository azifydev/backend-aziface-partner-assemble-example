openapi: 3.0.3
info:
  title: Assemble API
  version: 1.0.0
  description: API for managing Assemble platform
paths:
  /api/accounts/:
    get:
      operationId: api_accounts_list
      description: |-
        List all accounts for the authenticated tenant.
        Query Parameters:
            includeCustomer (bool): If true, includes full customer object in the customer field
      parameters:
      - in: query
        name: includeCustomer
        schema:
          type: boolean
          default: false
        description: Include full customer object in response (customer field)
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - accounts
      security:
      - ApiKey: []
      - ApiKey:
        - read
        - write
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAccountList'
              examples:
                WithoutCustomerDetails:
                  value:
                    count: 123
                    next: http://api.example.org/accounts/?page=4
                    previous: http://api.example.org/accounts/?page=2
                    results:
                    - count: 1
                      next: null
                      previous: null
                      results:
                      - id: uuid
                        customer_id: customer-uuid
                        customer: null
                        account_number: '12345'
                        account_type: CHECKING
                        branch: '0001'
                        created_at: '2024-01-01T00:00:00Z'
                        updated_at: '2024-01-01T00:00:00Z'
                  summary: Without customer details
                WithCustomerDetails:
                  value:
                    count: 123
                    next: http://api.example.org/accounts/?page=4
                    previous: http://api.example.org/accounts/?page=2
                    results:
                    - count: 1
                      next: null
                      previous: null
                      results:
                      - id: uuid
                        customer_id: customer-uuid
                        customer:
                          id: customer-uuid
                          name: John Doe
                          document: '12345678900'
                          email: john@example.com
                          phone: '+5511999999999'
                          is_active: true
                          created_at: '2024-01-01T00:00:00Z'
                          updated_at: '2024-01-01T00:00:00Z'
                        account_number: '12345'
                        account_type: CHECKING
                        branch: '0001'
                        created_at: '2024-01-01T00:00:00Z'
                        updated_at: '2024-01-01T00:00:00Z'
                  summary: With customer details
          description: List of accounts
    post:
      operationId: api_accounts_create
      description: Create a new account for a customer.
      parameters:
      - in: query
        name: includeCustomer
        schema:
          type: boolean
          default: false
        description: Include full customer object in response (customer field)
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AccountRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AccountRequest'
        required: true
      security:
      - ApiKey: []
      - ApiKey:
        - read
        - write
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
              examples:
                WithoutCustomerDetails:
                  value:
                    id: uuid
                    customer_id: customer-uuid
                    customer: null
                    account_number: '12345'
                    account_type: CHECKING
                    ispb: '12345678'
                    compe: '123'
                    branch: '0001'
                    created_at: '2024-01-01T00:00:00Z'
                    updated_at: '2024-01-01T00:00:00Z'
                  summary: Without customer details
                WithCustomerDetails:
                  value:
                    id: uuid
                    customer_id: customer-uuid
                    customer:
                      id: customer-uuid
                      name: John Doe
                      document: '12345678900'
                      email: john@example.com
                      phone: '+5511999999999'
                      is_active: true
                      created_at: '2024-01-01T00:00:00Z'
                      updated_at: '2024-01-01T00:00:00Z'
                    ispb: '12345678'
                    compe: '123'
