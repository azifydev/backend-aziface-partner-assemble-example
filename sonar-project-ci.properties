# Configuração do SonarQube para CI/CD
# Este arquivo deve ser usado em pipelines de CI/CD

# Configuração básica do projeto
sonar.projectKey=assemble
sonar.projectName=Assemble
sonar.projectVersion=${CI_COMMIT_TAG:-${CI_COMMIT_SHORT_SHA:-1.0}}

# Configuração de código fonte
sonar.sources=src
sonar.tests=src,test
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts,test/**/*.ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/docs/**,**/*.d.ts,**/prisma/**,**/database/**

# Configuração TypeScript
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Configuração de cobertura
sonar.coverage.exclusions=**/*.spec.ts,**/*.test.ts,**/*.dto.ts,**/*.module.ts,**/*.entity.ts,**/*.constants.ts,**/*.decorator.ts,**/*.guard.ts,**/*.strategy.ts,**/*-enum.ts,**/generate-swagger.ts,**/main.ts,**/repl.ts,**/config/**,**/common/generators/**,**/common/consts/**,**/authorization/default-config/**,**/middleware/**,**/common/types/**,**/authentication/interfaces/**,**/@types/**,**/modules/onboardings/schemas/**

# Configuração de linguagem
sonar.language=ts
sonar.sourceEncoding=UTF-8

# Quality Gate
sonar.qualitygate.wait=true

# Branch configuration for CI/CD
# Uncomment and configure based on your branching strategy
# sonar.branch.name=${CI_COMMIT_REF_NAME}
# sonar.branch.target=main

# Pull Request configuration
# sonar.pullrequest.key=${CI_MERGE_REQUEST_IID}
# sonar.pullrequest.branch=${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}
# sonar.pullrequest.base=${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}

# Security
sonar.security.hotspots.inheritFromParent=true

# Performance
sonar.cpd.exclusions=**/*.dto.ts,**/*.entity.ts,**/*.constants.ts
