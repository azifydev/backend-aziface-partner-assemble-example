<!DOCTYPE html>
<html>
  <head>
    <title>Swagger</title>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css" href="//unpkg.com/swagger-ui-dist@3/swagger-ui.css" />
  </head>
  <body>
    <div id="swagger-ui"></div>
    <script src="//unpkg.com/swagger-ui-dist@3/swagger-ui-bundle.js"></script>
    <script>
    const ui = SwaggerUIBundle({
        url: "{% url 'schema-json' '.json' %}",
        dom_id: '#swagger-ui',
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIBundle.SwaggerUIStandalonePreset
        ],
        layout: "BaseLayout",
        requestInterceptor: (request) => {
          request.headers.Authorization = 'Bearer YOUR_API_KEY';
          return request;
        },
        onComplete: () => {
          // Force all operations to show as requiring authentication
          setTimeout(() => {
            const operations = document.querySelectorAll('.opblock');
            operations.forEach(op => {
              const lockIcon = op.querySelector('.authorize-wrapper');
              if (!lockIcon) {
                const header = op.querySelector('.opblock-summary');
                if (header) {
                  const newLockIcon = document.createElement('div');
                  newLockIcon.className = 'authorize-wrapper';
                  newLockIcon.innerHTML = '<button class="authorize-button" title="Authorize"><span class="authorize-button__icon"><svg width="20" height="20" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M17.5 8.333v-2.5a5.833 5.833 0 0 0-11.666 0v2.5H3.333v10h13.334V8.333h-2.5zm-5.833 5.834a1.667 1.667 0 1 1 0-3.334 1.667 1.667 0 0 1 0 3.334zm2.5-5.834h-5V5.833a2.5 2.5 0 0 1 5 0v2.5z" fill="currentColor" fill-rule="nonzero"/></svg></span><span class="authorize-button__text">Authorize</span></button>';
                  header.appendChild(newLockIcon);
                }
              }
            });
          }, 1000);
        }
      })
    </script>
  </body>
</html>
